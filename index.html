<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio Saya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="#beranda" class="logo" id="logo">Portofolio</a>
    <button id="menuBtn" class="icon-btn menu-btn" aria-label="Buka menu" aria-expanded="false">☰</button>
    <nav id="nav" class="nav">
      <a href="#tentang">Tentang</a>
      <a href="#keahlian">Keahlian</a>
      <a href="#proyek">Proyek</a>
      <a href="#kontak">Kontak</a>
    </nav>
    <button id="themeBtn" class="icon-btn" aria-label="Ganti tema">🌙</button>
  </header>

  <main>
    <section id="beranda" class="hero">
      <p id="sapaan" class="sapaan"></p>
      <h1 id="nama"></h1>
      <p id="keanggotaan" class="muted"></p>
      <button id="sapaBtn" class="btn">Ganti contoh jam</button>
      <p id="infoJam" class="muted small"></p>
    </section>

    <section id="tentang">
      <h2>Tentang Saya</h2>
      <p id="bio"></p>
    </section>

    <section id="keahlian">
      <h2>Keahlian</h2>
      <ul id="daftarKeahlian" class="chips"></ul>
    </section>

    <section id="proyek">
      <h2>Proyek</h2>
      <div id="daftarProyek" class="grid"></div>
    </section>

    <section id="kontak">
      <h2>Kontak</h2>
      <form id="formKontak" novalidate>
        <label for="inNama">Nama</label>
        <input id="inNama" type="text" autocomplete="name">
        <label for="inEmail">Email</label>
        <input id="inEmail" type="email" autocomplete="email">
        <label for="inPesan">Pesan</label>
        <textarea id="inPesan" rows="4"></textarea>
        <button class="btn" type="submit">Kirim</button>
        <p id="pesanForm" role="alert" class="form-msg"></p>
      </form>
    </section>
  </main>

  <footer class="footer"><p id="footerTeks"></p></footer>
  <script src="script.js"></script>
</body>
</html>
